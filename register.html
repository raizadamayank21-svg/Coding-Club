<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for Invertis Coding Club">
    <meta name="author" content="Mayank Raizada">

    <title>Register | Coding Club</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.png">
</head>

<body>

    <header>
        <h1>Student Registration</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="register.html">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Join Invertis Coding Club</h2>

            <form action="#" method="post">

                <!-- Name -->
                <label for="name">Full Name:</label>
                <input type="text" id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>

                <!-- Email -->
                <label for="email">Email:</label>
                <input type="email" id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <!-- Password -->
                <label for="password">Password:</label>
                <input type="password" id="password"
                       name="password"
                       placeholder="Create password"
                       required>

                <!-- Date -->
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">

                <!-- Phone -->
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone"
                       name="phone"
                       placeholder="Enter phone number">

                <!-- Gender -->
                <label>Gender:</label>

                <input type="radio" id="male"
                       name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female"
                       name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other"
                       name="gender" value="Other">
                <label for="other">Other</label>

                <!-- Skills -->
                <label>Choose Your Skills:</label>

                <input type="checkbox" id="html"
                       name="skills" value="HTML">
                <label for="html">HTML</label>

                <input type="checkbox" id="css"
                       name="skills" value="CSS">
                <label for="css">CSS</label>

                <input type="checkbox" id="java"
                       name="skills" value="Java">
                <label for="java">Java</label>

                <input type="checkbox" id="javascript"
                       name="skills" value="JavaScript">
                <label for="javascript">JavaScript</label>

                <!-- Dropdown -->
                <label for="year">Select Your Year:</label>

                <select id="year" name="year">
                    <option value="">Select Year</option>
                    <option value="1st">1st Year</option>
                    <option value="2nd">2nd Year</option>
                    <option value="3rd">3rd Year</option>
                    <option value="4th">4th Year</option>
                </select>

                <!-- Message -->
                <label for="message">Why do you want to join?</label>

                <textarea id="message" name="message"
                          rows="5"
                          placeholder="Write your message here">
                </textarea>

                <!-- Submit -->
                <button type="submit">
                    Submit Registration
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>©️ 2026 Invertis Coding Club</p>
    </footer>

</body>
</html>
